<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Цветочный Колодец</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #1a1520;
            font-family: 'Georgia', 'Times New Roman', serif;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            cursor: none;
        }
        #restart {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            padding: 18px 48px;
            font-size: 22px;
            font-family: inherit;
            background: linear-gradient(135deg, #e8b4b8, #d4919a);
            color: #fff;
            border: 2px solid rgba(255,255,255,0.4);
            border-radius: 30px;
            cursor: pointer;
            z-index: 10;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        #restart:hover {
            transform: translate(-50%, -50%) scale(1.05);
            box-shadow: 0 12px 40px rgba(0,0,0,0.4);
        }
        #flowerCount {
            position: fixed;
            top: 10px;
            left: 10px;
            padding: 8px 16px;
            font-size: 13px;
            font-family: inherit;
            background: rgba(0,0,0,0.5);
            color: #ffd700;
            border-radius: 15px;
            z-index: 10;
        }
    </style>
</head>
<body>
    <canvas id="game"></canvas>
    <button id="restart">Начать заново</button>
    <div id="flowerCount"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <!-- Import palette manager first to ensure unique palettes from 1000.json -->
    <script src="js/palette-manager.js"></script>
    <!-- Import utility functions first -->
    <script src="js/flower-gen-utils.js"></script>
    <script src="js/flower-gen-petal.js"></script>
    <script src="js/flower-gen-center.js"></script>
    <script src="js/flower-gen-stamens.js"></script>
    <script src="js/flower-gen-stamens-fx.js"></script>
    <script src="js/flower-gen-types.js"></script>
    <script src="js/flower-gen-types-advanced.js"></script>
    <script src="js/flower-gen-types-bio-inspired.js"></script>
    <script type="module">
        // Wait for all functions to be loaded and then extend the flower drawer
        setTimeout(function() {
            if (typeof extendFlowerDrawer === 'function') {
                extendFlowerDrawer();
                console.log("Bio-inspired flower types registered successfully");
            } else {
                console.error("extendFlowerDrawer function not found");
            }
        }, 100);

        import { initGame, restart, setupInput } from './js/game.js';
        import { getAllFlowersWithGenerated } from './js/random-flowers.js';
        import { CONFIG } from './js/config.js';
        import { generateRandomFlowerBatch, resetGeneratedFlowers, logGeneratedFlowers } from './js/random-flowers.js';

        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const restartBtn = document.getElementById('restart');
        const flowerCountDiv = document.getElementById('flowerCount');

        // Установим значения по умолчанию для обводки и замощения
        window.OUTLINE_ENABLED = true;
        window.TESSELLATION_ENABLED = true;

        function updateFlowerCount() {
            // Count only generated flowers
            const allFlowers = getAllFlowersWithGenerated();
            flowerCountDiv.textContent = `🌺 Цветов: ${allFlowers.length}`;
        }

        function startGame() {
            if (typeof Matter !== 'undefined') {
                initGame(canvas, ctx, restartBtn, Matter);
                setupInput();
                restartBtn.addEventListener('click', restart);
                updateFlowerCount();
            } else {
                document.body.innerHTML = '<p style="color:#fff;text-align:center;margin-top:40vh;">Ошибка загрузки Matter.js. Проверьте подключение к интернету.</p>';
            }
        }

        // Initialize the game with only generated flowers
        async function boot() {
            flowerCountDiv.textContent = '🌺 Генерация цветов...';
            
            // Clear any existing generated flowers and generate new ones
            resetGeneratedFlowers();
            
            // First generate base flowers without diversity
            generateRandomFlowerBatch(30); // Base flowers
            
            // Then add diversity flowers
            window.COLOR_DIVERSITY = {
                enabled: true,
                baseHue: 120, // green base
                variationRange: 60 // 90-150 degrees
            };
            
            generateRandomFlowerBatch(20); // Diversity flowers
            
            // Update MAX_LEVEL to reflect only generated flowers
            CONFIG.MAX_LEVEL = getAllFlowersWithGenerated().length - 1;
            updateFlowerCount(); // Update the flower count display
            
            // Log information about the generated flowers to console after a short delay
            setTimeout(() => {
                logGeneratedFlowers();
            }, 2000); // Wait 2 seconds to ensure flowers are fully generated before logging
            
            if (typeof Matter !== 'undefined') {
                startGame();
            } else {
                window.addEventListener('load', () => {
                    startGame();
                });
            }
        }

        boot();
    </script>
</body>
</html>
