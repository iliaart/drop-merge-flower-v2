<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Цветочный Колодец</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #1a1520;
            font-family: 'Georgia', 'Times New Roman', serif;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            cursor: default; /* Changed from 'none' to 'default' to enable mouse cursor */
            /* Hardware acceleration for better mobile performance */
            will-change: transform;
            -webkit-transform: translateZ(0);
            -moz-transform: translateZ(0);
            -ms-transform: translateZ(0);
            -o-transform: translateZ(0);
            transform: translateZ(0);
        }
        #restart {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            padding: 18px 48px;
            font-size: 22px;
            font-family: inherit;
            background: linear-gradient(135deg, #e8b4b8, #d4919a);
            color: #fff;
            border: 2px solid rgba(255,255,255,0.4);
            border-radius: 30px;
            cursor: pointer;
            z-index: 10;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        #restart:hover {
            transform: translate(-50%, -50%) scale(1.05);
            box-shadow: 0 12px 40px rgba(0,0,0,0.4);
        }
        #flowerCount {
            position: fixed;
            top: 10px;
            left: 10px;
            padding: 8px 16px;
            font-size: 13px;
            font-family: inherit;
            background: rgba(0,0,0,0.5);
            color: #ffd700;
            border-radius: 15px;
            z-index: 10;
        }
    </style>
</head>
<body>
    <canvas id="game"></canvas>
    <button id="restart">Начать заново</button>
    <div id="flowerCount"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <!-- Import palette manager first to ensure unique palettes from 1000.json -->
    <script src="js/palette-manager.js"></script>
    <!-- Import utility functions first -->
    <script src="js/flower-gen-utils.js"></script>
    <script src="js/flower-gen-petal.js"></script>
    <script src="js/flower-gen-center.js"></script>
    <script src="js/flower-gen-stamens.js"></script>
    <script src="js/flower-gen-stamens-fx.js"></script>
    <script src="js/flower-gen-types.js"></script>
    <script src="js/flower-gen-types-advanced.js"></script>
    <script src="js/flower-gen-types-bio-inspired.js"></script>
    <script>
        // Wait for all functions to be loaded and then extend the flower drawer
        setTimeout(function() {
            if (typeof extendFlowerDrawer === 'function') {
                extendFlowerDrawer();
                console.log("Bio-inspired flower types registered successfully");
            } else {
                console.error("extendFlowerDrawer function not found");
            }
        }, 100);
    </script>
    <script type="module">
        import { initGame, restart, setupInput } from './js/game.js';
        import { getAllFlowersWithGenerated } from './js/random-flowers.js';
        import { CONFIG } from './js/config.js';
        import { generateRandomFlowerBatch, resetGeneratedFlowers, logGeneratedFlowers } from './js/random-flowers.js';
        import { perfOptimizer, memoryManager } from './js/performance.js';

        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const restartBtn = document.getElementById('restart');
        const flowerCountDiv = document.getElementById('flowerCount');

        // Установим значения по умолчанию для обводки и замощения
        window.OUTLINE_ENABLED = true;
        window.TESSELLATION_ENABLED = true;

        // Performance optimization variables
        let lastFrameTime = 0;
        let frameSkipCounter = 0;
        let perfMonitor = {
            frameCount: 0,
            lastPerfCheck: performance.now(),
            avgFps: 60,
            renderSkips: 0,
            lastRenderTime: 0
        };

        // Device capability detection
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        const isLowEndMobile = isMobile && (/Android/.test(navigator.userAgent) && navigator.hardwareConcurrency <= 4 ||
                                           /iPhone/.test(navigator.userAgent) && parseInt(navigator.userAgent.match(/iPhone(\d+,\d+)/)?.[1]?.split(',')[0] || 0) < 12);
                                           
        // Performance-based settings
        const PERF_SETTINGS = {
            high: { maxFPS: 60, maxParticles: 500, ambientMotes: 15, mergeCheckFreq: 2 },
            medium: { maxFPS: 45, maxParticles: 350, ambientMotes: 10, mergeCheckFreq: 3 },
            low: { maxFPS: 30, maxParticles: 200, ambientMotes: 5, mergeCheckFreq: 4 }
        };
        
        // Determine performance level based on device capabilities
        let perfLevel = 'high';
        if (isLowEndMobile) perfLevel = 'low';
        else if (isMobile) perfLevel = 'medium';
        else if (navigator.hardwareConcurrency <= 4) perfLevel = 'medium';
        
        const perfConfig = PERF_SETTINGS[perfLevel];
        console.log(`Performance level set to: ${perfLevel} (${isMobile ? 'mobile' : 'desktop'})`);

        function updateFlowerCount() {
            // Count only generated flowers
            const allFlowers = getAllFlowersWithGenerated();
            flowerCountDiv.textContent = `🌺 Цветов: ${allFlowers.length}`;
        }

        function startGame() {
            if (typeof Matter !== 'undefined') {
                // Pass performance config to game initialization
                window.PERFORMANCE_CONFIG = {
                    ...perfConfig,
                    isMobile: isMobile,
                    isLowEndDevice: isLowEndMobile
                };
                initGame(canvas, ctx, restartBtn, Matter);
                setupInput();
                restartBtn.addEventListener('click', restart);
                updateFlowerCount();
            } else {
                document.body.innerHTML = '<p style="color:#fff;text-align:center;margin-top:40vh;">Ошибка загрузки Matter.js. Проверьте подключение к интернету.</p>';
            }
        }

        // Initialize the game with only generated flowers
        async function boot() {
            flowerCountDiv.textContent = '🌺 Генерация цветов...';
            
            // Clear any existing generated flowers and generate new ones
            resetGeneratedFlowers();
            
            // Initialize unique palettes from 1000.json ensuring no repeated petal or center colors
            if (typeof window.initializeUniquePalettes === 'function') {
                await window.initializeUniquePalettes();
            }
            
            // Generate fewer flowers on low-end devices for better performance
            const flowerCount = isLowEndMobile ? 30 : isMobile ? 40 : 50;
            generateRandomFlowerBatch(flowerCount); 
            
            // Update MAX_LEVEL to reflect only generated flowers
            CONFIG.MAX_LEVEL = getAllFlowersWithGenerated().length - 1;
            updateFlowerCount(); // Update the flower count display
            
            // Log information about the generated flowers to console after a short delay
            setTimeout(() => {
                logGeneratedFlowers();
            }, 2000); // Wait 2 seconds to ensure flowers are fully generated before logging
            
            if (typeof Matter !== 'undefined') {
                startGame();
            } else {
                window.addEventListener('load', () => {
                    startGame();
                });
            }
        }

        // Run performance optimization loop
        function perfLoop() {
            perfOptimizer.update();
            memoryManager.update();
            requestAnimationFrame(perfLoop);
        }
        perfLoop();

        boot();
    </script>
</body>
</html>
